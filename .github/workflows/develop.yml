name: "DEV DEPLOY"

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      aws-assume-role-arn: "arn:aws:iam::738140882659:role/github-actions-galdinoigor-pipeline"
      aws-region: "sa-east-1"
      aws-statefile-s3-bucket: "bucket-galdinoigor-firstgluejob-statefile"
      aws-lock-dynamodb-table: "dynamodb-table-firstgluejob-terraform-lock"
      aws-script-s3-bucket: "bucket-galdinoigor-firstgluejob-dev-scripts"

      
